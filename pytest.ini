[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests - fast, isolated component tests
    integration: Integration tests - component interaction with mocked external services
    e2e: End-to-end tests - real multi-agent scenarios with subprocess agents and HTTP
    contract: Contract tests - protocol specification compliance verification (A2A, SLIM, x402)
    slow: Slow running tests - performance and large-scale scenarios
    timeout: Mark test with custom timeout value
