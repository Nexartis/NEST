[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: marks tests as unit tests (fast, isolated) - from PR #20
    integration: marks tests as integration tests (may require external services)
    slow: marks tests as slow running (large scale scenarios) - from PR #20
